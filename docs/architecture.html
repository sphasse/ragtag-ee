* { box-sizing: border-box; margin: 0; padding: 0; }

body {

  color: var(--text);

  padding-right: max(16px, env(safe-area-inset-right, 0px));

}

header {
  margin-bottom: 28px;
}
header h1 {
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}
header p {
  font-size: 0.82rem;
  color: var(--sub);
  margin-top: 4px;
  line-height: 1.5;
}

.diagram-wrap {
  width: 100%;
  overflow-x: auto;
}

svg {
  display: block;
  min-width: 960px;
  font-family: 'Inter', system-ui, sans-serif;
}

/* legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;

}
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 0.75rem;
  color: var(--sub);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
